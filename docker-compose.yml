services:
  redis:
    image: redis:7-alpine
    container_name: servimed-redis
    # Exposto só em localhost: o broker não deve ficar acessível na rede.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data: